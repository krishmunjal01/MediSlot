<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Patient Registration')}"></head>
<body style="background-color: var(--bg-main); padding: 40px 20px;">

<div style="max-width: 600px; margin: 0 auto;">
    <div style="text-align: center; margin-bottom: 24px;">
        <div style="display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; background-color: var(--primary-accent); color: white; border-radius: var(--radius-sm); font-weight: 700; font-size: 18px; margin-bottom: 8px;">M</div>
        <h1 class="serif-heading" style="font-size: 26px; font-weight: 500; margin-bottom: 4px;">Patient Registration</h1>
        <p style="font-size: 13.5px;">Register your profile with the hospital to book and coordinate clinical appointments.</p>
    </div>

    <div class="surface-card">
        <div th:if="${errorMessage}" class="alert-banner alert-error">
            <span th:text="${errorMessage}">Error message</span>
        </div>

        <form th:action="@{/register}" th:object="${patientForm}" method="post">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group" style="grid-column: span 2;">
                    <label class="form-label">Full Name *</label>
                    <input type="text" th:field="*{fullName}" class="form-control" placeholder="e.g. Eleanor Vance" required>
                    <div class="form-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address *</label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="eleanor.vance@example.com" required>
                    <div class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Phone Number *</label>
                    <input type="text" th:field="*{phone}" class="form-control" placeholder="+1 (555) 012-3456" required>
                    <div class="form-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Date of Birth *</label>
                    <input type="date" th:field="*{dateOfBirth}" class="form-control" required>
                    <div class="form-error" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Gender *</label>
                    <select th:field="*{gender}" class="form-select" required>
                        <option value="">Select gender</option>
                        <option value="Female">Female</option>
                        <option value="Male">Male</option>
                        <option value="Other">Other</option>
                    </select>
                    <div class="form-error" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Blood Group (Optional)</label>
                    <select th:field="*{bloodGroup}" class="form-select">
                        <option value="">Select blood group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Emergency Contact Phone</label>
                    <input type="text" th:field="*{emergencyContact}" class="form-control" placeholder="+1 (555) 999-0000">
                </div>

                <div class="form-group" style="grid-column: span 2;">
                    <label class="form-label">Residential Address *</label>
                    <textarea th:field="*{address}" class="form-control" rows="2" placeholder="Full street address and city" required></textarea>
                    <div class="form-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Choose Username *</label>
                    <input type="text" th:field="*{username}" class="form-control" placeholder="e.g. eleanor_v" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Choose Password *</label>
                    <input type="password" th:field="*{password}" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button type="submit" class="btn-primary" style="flex: 1; justify-content: center;">
                    Complete Registration & Create Account
                </button>
                <a th:href="@{/login}" class="btn-secondary">Back to Sign In</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
