<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>
<header th:fragment="topbar(title, breadcrumb)" class="top-bar">
    <div class="top-bar-left">
        <button type="button" class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Open Navigation Menu">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>
        <div class="page-title-area">
            <div class="page-breadcrumbs" th:text="${breadcrumb != null ? breadcrumb : 'MediSlot Hospital Coordination'}">MediSlot</div>
            <h1 th:text="${title != null ? title : 'Overview'}">Overview</h1>
        </div>
    </div>

    <div class="top-bar-actions">
        <span class="top-bar-date" style="font-size: 12px; color: var(--text-muted); font-feature-settings: 'tnum';"
              th:text="${#temporals.format(#temporals.createNow(), 'EEEE, dd MMMM yyyy')}">Date</span>
    </div>
</header>
</body>

</html>
