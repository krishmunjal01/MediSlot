<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Book Appointment')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('book')}"></aside>

    <div class="main-wrapper">
        <header th:replace="~{fragments/topbar :: topbar('Front Desk Consultation Booking', 'Reception / Book')}"></header>

        <main class="content-container" style="max-width: 800px;">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="surface-card">
                <div class="card-header-clean">
                    <div>
                        <h2 class="serif-heading" style="font-size: 18px;">Schedule Patient Appointment</h2>
                        <p style="font-size: 12.5px;">Transactional booking with database-level uniqueness and concurrency protection.</p>
                    </div>
                </div>

                <form th:action="@{/receptionist/book}" th:object="${bookingRequest}" method="post">
                    <input type="hidden" id="selectedSlotIdInput" th:field="*{slotId}">

                    <div class="form-group">
                        <label class="form-label">Select Patient *</label>
                        <select th:field="*{patientId}" class="form-select" required>
                            <option value="">Choose registered patient...</option>
                            <option th:each="p : ${patients}"
                                    th:value="${p.patientId}"
                                    th:text="${p.fullName + ' (' + p.patientCode + ') - ' + p.phone}"
                                    th:selected="${selectedPatientId == p.patientId}">Eleanor Vance</option>
                        </select>
                        <div class="form-error" th:if="${#fields.hasErrors('patientId')}" th:errors="*{patientId}"></div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div class="form-group">
                            <label class="form-label">Attending Doctor *</label>
                            <select id="bookingDoctorSelect" th:field="*{doctorId}" class="form-select" required>
                                <option value="">Choose doctor...</option>
                                <option th:each="doc : ${doctors}"
                                        th:value="${doc.doctorId}"
                                        th:text="${'Dr. ' + doc.fullName + ' — ' + doc.specialization}">Dr. Arjun</option>
                            </select>
                            <div class="form-error" th:if="${#fields.hasErrors('doctorId')}" th:errors="*{doctorId}"></div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Consultation Date *</label>
                            <input type="date" id="bookingDateInput" th:field="*{appointmentDate}" class="form-control"
                                   th:min="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" required>
                            <div class="form-error" th:if="${#fields.hasErrors('appointmentDate')}" th:errors="*{appointmentDate}"></div>
                        </div>
                    </div>

                    <!-- Available Slots Picker Container -->
                    <div class="form-group" style="margin-top: 10px;">
                        <label class="form-label">Select Available Time Slot *</label>
                        <div id="slotSelectionContainer">
                            <p class="form-text">Choose a doctor and date above to load available time slots.</p>
                        </div>
                        <div class="form-error" th:if="${#fields.hasErrors('slotId')}" th:errors="*{slotId}"></div>
                    </div>

                    <div class="form-group" style="margin-top: 20px;">
                        <label class="form-label">Reason for Visit / Symptoms</label>
                        <input type="text" th:field="*{reasonForVisit}" class="form-control" placeholder="e.g. Follow-up after blood pressure check, palpitations">
                    </div>

                    <div style="display: flex; gap: 12px; margin-top: 24px;">
                        <button type="submit" class="btn-primary" style="padding: 10px 24px;">
                            Confirm & Reserve Appointment
                        </button>
                        <a th:href="@{/receptionist/dashboard}" class="btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

<script th:src="@{/js/medislot.js}"></script>
</body>
</html>
