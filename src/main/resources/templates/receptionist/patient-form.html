<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Register Walk-In Patient')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('new-patient')}"></aside>

    <div class="main-wrapper">
        <header th:replace="~{fragments/topbar :: topbar('Register New Walk-In Patient', 'Reception / Patients / Register')}"></header>

        <main class="content-container" style="max-width: 760px;">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="surface-card">
                <div class="card-header-clean">
                    <h2 class="serif-heading" style="font-size: 18px;">Walk-In Patient Registration</h2>
                    <a th:href="@{/receptionist/patients}" class="btn-secondary btn-sm">Cancel</a>
                </div>

                <form th:action="@{/receptionist/patients/save}" th:object="${patientForm}" method="post">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div class="form-group" style="grid-column: span 2;">
                            <label class="form-label">Full Legal Name *</label>
                            <input type="text" th:field="*{fullName}" class="form-control" placeholder="Eleanor Vance" required>
                            <div class="form-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Email Address *</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="patient@example.com" required>
                            <div class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Phone Number *</label>
                            <input type="text" th:field="*{phone}" class="form-control" placeholder="+1 (555) 010-0000" required>
                            <div class="form-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Date of Birth *</label>
                            <input type="date" th:field="*{dateOfBirth}" class="form-control" required>
                            <div class="form-error" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Gender *</label>
                            <select th:field="*{gender}" class="form-select" required>
                                <option value="">Select gender</option>
                                <option value="Female">Female</option>
                                <option value="Male">Male</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Blood Group</label>
                            <select th:field="*{bloodGroup}" class="form-select">
                                <option value="">Not known</option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Emergency Contact Phone</label>
                            <input type="text" th:field="*{emergencyContact}" class="form-control" placeholder="+1 (555) 999-0000">
                        </div>

                        <div class="form-group" style="grid-column: span 2;">
                            <label class="form-label">Residential Address *</label>
                            <textarea th:field="*{address}" class="form-control" rows="2" placeholder="Full residential street address..." required></textarea>
                            <div class="form-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                        </div>
                    </div>

                    <div style="display: flex; gap: 12px; margin-top: 24px;">
                        <button type="submit" class="btn-primary">Register Patient</button>
                        <a th:href="@{/receptionist/patients}" class="btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
</body>
</html>
