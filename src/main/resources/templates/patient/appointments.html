<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('My Appointments')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('appointments')}"></aside>

    <div class="main-wrapper">
        <header th:replace="~{fragments/topbar :: topbar('Consultation Schedule & History', 'Patient / Appointments')}"></header>

        <main class="content-container">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="surface-card">
                <div class="card-header-clean">
                    <div>
                        <h2 class="serif-heading" style="font-size: 18px;">All Booked Consultations</h2>
                        <p style="font-size: 12.5px;">Manage your appointments, request rescheduling, or cancel visits.</p>
                    </div>
                    <a th:href="@{/patient/book}" class="btn-primary btn-sm">+ Book New</a>
                </div>

                <div class="table-container" th:if="${not #lists.isEmpty(appointments)}">
                    <table class="medislot-table">
                        <thead>
                            <tr>
                                <th>Ref #</th>
                                <th>Appointment Date</th>
                                <th>Time</th>
                                <th>Doctor</th>
                                <th>Department</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="apt : ${appointments}">
                                <td><strong th:text="${apt.appointmentReference}">APT-001</strong></td>
                                <td th:text="${#temporals.format(apt.appointmentDate, 'dd MMMM yyyy')}">15 Nov 2026</td>
                                <td th:text="${#temporals.format(apt.startTime, 'HH:mm')}">10:00</td>
                                <td th:text="${'Dr. ' + apt.doctorName}">Dr. Arjun</td>
                                <td th:text="${apt.departmentName}">Cardiology</td>
                                <td>
                                    <span class="status-pill"
                                          th:classappend="'status-' + ${#strings.toLowerCase(#strings.replace(apt.status.name(), '_', '-'))}"
                                          th:text="${apt.status.label}">Status</span>
                                </td>
                                <td>
                                    <div style="display: flex; gap: 6px;">
                                        <a th:href="@{/patient/appointments/{id}(id=${apt.appointmentId})}" class="btn-secondary btn-sm">Receipt</a>
                                        <a th:if="${apt.status.canBeRescheduled()}"
                                           th:href="@{/patient/appointments/{id}/reschedule(id=${apt.appointmentId})}"
                                           class="btn-secondary btn-sm">Reschedule</a>
                                        <form th:if="${apt.status.canBeCancelled()}"
                                              th:action="@{/patient/appointments/{id}/cancel(id=${apt.appointmentId})}" method="post" style="display: inline;"
                                              onsubmit="return confirm('Cancel this appointment? Your time slot will be released back to other patients.');">
                                            <button type="submit" class="btn-danger-outline btn-sm">Cancel</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="empty-state" th:if="${#lists.isEmpty(appointments)}">
                    <p>You have no appointments on file.</p>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
