# ==============================================================
# MediSlot Application Configuration
# ==============================================================
server.port=${PORT:8080}
spring.application.name=medislot

# Database Connection (MySQL 8.0)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medislot_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# SQL Initialization
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# MVC / Logging
logging.level.com.medislot=DEBUG
logging.level.org.springframework.jdbc=INFO
logging.level.org.springframework.security=INFO

# File / Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
