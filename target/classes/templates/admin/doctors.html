<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Doctor Management')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('doctors')}"></aside>

    <div class="main-wrapper">
        <header th:replace="~{fragments/topbar :: topbar('Medical Staff & Doctors', 'Admin / Doctors')}"></header>

        <main class="content-container">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="surface-card" style="padding: 16px 20px; margin-bottom: 20px;">
                <form th:action="@{/admin/doctors}" method="get" style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 220px;">
                        <input type="text" name="query" th:value="${selectedQuery}" class="form-control" placeholder="Search doctor by name, specialty, or department...">
                    </div>
                    <div style="width: 200px;">
                        <select name="departmentId" class="form-select">
                            <option value="">All Departments</option>
                            <option th:each="dept : ${departments}"
                                    th:value="${dept.departmentId}"
                                    th:text="${dept.name}"
                                    th:selected="${selectedDept == dept.departmentId}">Cardiology</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-secondary">Filter</button>
                    <a th:href="@{/admin/doctors}" class="btn-secondary" style="padding: 8px 12px;" title="Reset filter">Reset</a>
                    <a th:href="@{/admin/doctors/new}" class="btn-primary" style="margin-left: auto;">+ Add Doctor</a>
                </form>
            </div>

            <div class="surface-card">
                <div class="table-container">
                    <table class="medislot-table">
                        <thead>
                            <tr>
                                <th>Doctor ID</th>
                                <th>Doctor Name</th>
                                <th>Department</th>
                                <th>Specialization</th>
                                <th>Experience</th>
                                <th>Consultation Fee</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="doc : ${doctors}">
                                <td><span style="font-feature-settings: 'tnum'; font-weight: 600;" th:text="${'DOC-' + doc.doctorId}">DOC-1</span></td>
                                <td>
                                    <div style="font-weight: 600;" th:text="${'Dr. ' + doc.fullName}">Dr. Arjun Mehta</div>
                                    <div style="font-size: 11.5px; color: var(--text-muted);" th:text="${doc.email}">email</div>
                                </td>
                                <td th:text="${doc.departmentName}">Cardiology</td>
                                <td th:text="${doc.specialization}">Cardiologist</td>
                                <td th:text="${doc.experienceYears + ' yrs'}">14 yrs</td>
                                <td><strong th:text="${'$' + #numbers.formatDecimal(doc.consultationFee, 1, 2)}">$800.00</strong></td>
                                <td>
                                    <span class="status-pill"
                                          th:classappend="${doc.status.name() == 'ACTIVE' ? 'status-confirmed' : 'status-cancelled'}"
                                          th:text="${doc.status.label}">Active</span>
                                </td>
                                <td>
                                    <div style="display: flex; gap: 6px;">
                                        <a th:href="@{/admin/doctors/edit/{id}(id=${doc.doctorId})}" class="btn-secondary btn-sm">Edit</a>
                                        <form th:action="@{/admin/doctors/{id}/status(id=${doc.doctorId})}" method="post" style="display: inline;">
                                            <input type="hidden" name="status" th:value="${doc.status.name() == 'ACTIVE' ? 'INACTIVE' : 'ACTIVE'}">
                                            <button type="submit" class="btn-secondary btn-sm" th:text="${doc.status.name() == 'ACTIVE' ? 'Deactivate' : 'Activate'}">Toggle</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
