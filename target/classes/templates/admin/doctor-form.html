<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Doctor Profile Form')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('doctors')}"></aside>

    <div class="main-wrapper">
        <header th:replace="~{fragments/topbar :: topbar('Doctor Profile Configuration', 'Admin / Doctors / Form')}"></header>

        <main class="content-container" style="max-width: 800px;">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="surface-card">
                <div class="card-header-clean">
                    <h2 class="serif-heading" style="font-size: 18px;"
                        th:text="${doctorForm.doctorId != null ? 'Edit Doctor Profile' : 'Add New Attending Doctor'}">Doctor Details</h2>
                    <a th:href="@{/admin/doctors}" class="btn-secondary btn-sm">Cancel</a>
                </div>

                <form th:action="@{/admin/doctors/save}" th:object="${doctorForm}" method="post">
                    <input type="hidden" th:field="*{doctorId}">
                    <input type="hidden" th:field="*{userId}">

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div class="form-group" style="grid-column: span 2;">
                            <label class="form-label">Full Doctor Name *</label>
                            <input type="text" th:field="*{fullName}" class="form-control" placeholder="e.g. Arjun Mehta" required>
                            <div class="form-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Hospital Email *</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="arjun.mehta@medislot.org" required>
                            <div class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Phone Number *</label>
                            <input type="text" th:field="*{phone}" class="form-control" placeholder="+1 (555) 019-2831" required>
                            <div class="form-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Department *</label>
                            <select th:field="*{departmentId}" class="form-select" required>
                                <option value="">Select Department</option>
                                <option th:each="dept : ${departments}"
                                        th:value="${dept.departmentId}"
                                        th:text="${dept.name}">Cardiology</option>
                            </select>
                            <div class="form-error" th:if="${#fields.hasErrors('departmentId')}" th:errors="*{departmentId}"></div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Specialization *</label>
                            <input type="text" th:field="*{specialization}" class="form-control" placeholder="e.g. Interventional Cardiology" required>
                            <div class="form-error" th:if="${#fields.hasErrors('specialization')}" th:errors="*{specialization}"></div>
                        </div>

                        <div class="form-group" style="grid-column: span 2;">
                            <label class="form-label">Qualifications & Degrees *</label>
                            <input type="text" th:field="*{qualification}" class="form-control" placeholder="e.g. MBBS, MD (Cardiology), FACC" required>
                            <div class="form-error" th:if="${#fields.hasErrors('qualification')}" th:errors="*{qualification}"></div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Years of Experience *</label>
                            <input type="number" th:field="*{experienceYears}" class="form-control" min="0" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Consultation Fee ($) *</label>
                            <input type="number" th:field="*{consultationFee}" class="form-control" step="0.01" min="0" required>
                        </div>

                        <div class="form-group" th:if="${doctorForm.doctorId == null}">
                            <label class="form-label">Portal Username *</label>
                            <input type="text" th:field="*{username}" class="form-control" placeholder="dr.arjun" required>
                        </div>

                        <div class="form-group" th:if="${doctorForm.doctorId == null}">
                            <label class="form-label">Portal Password *</label>
                            <input type="password" th:field="*{password}" class="form-control" placeholder="••••••••" required>
                        </div>

                        <div class="form-group" th:if="${doctorForm.doctorId != null}">
                            <label class="form-label">Status</label>
                            <select th:field="*{status}" class="form-select">
                                <option value="ACTIVE">ACTIVE</option>
                                <option value="INACTIVE">INACTIVE</option>
                                <option value="ON_LEAVE">ON_LEAVE</option>
                            </select>
                        </div>
                    </div>

                    <div style="display: flex; gap: 12px; margin-top: 24px;">
                        <button type="submit" class="btn-primary">Save Doctor Profile</button>
                        <a th:href="@{/admin/doctors}" class="btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
</body>
</html>
