<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('System Error')}"></head>
<body style="background-color: var(--bg-main); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">
<div class="surface-card" style="max-width: 480px; text-align: center; padding: 40px 32px;">
    <div style="width: 50px; height: 50px; border-radius: 50%; background-color: var(--danger-bg); color: var(--danger); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px;">
        <svg style="width: 24px; height: 24px;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    </div>
    <h2 class="serif-heading" style="font-size: 22px; margin-bottom: 8px;">System Exception (500)</h2>
    <p th:text="${errorMessage != null ? errorMessage : 'An unexpected error occurred during database or server execution.'}" style="font-size: 13.5px; margin-bottom: 24px;">Server error.</p>
    <a th:href="@{/}" class="btn-primary" style="justify-content: center;">Return to Safety</a>
</div>
</body>
</html>
