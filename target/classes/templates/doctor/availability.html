<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Doctor Availability')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('availability')}"></aside>

    <div class="main-wrapper">
        <header th:replace="~{fragments/topbar :: topbar('Personal Working Hours & Slots', 'Doctor / Availability')}"></header>

        <main class="content-container">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                <!-- Weekly Recurring Shift Table -->
                <div class="surface-card">
                    <div class="card-header-clean">
                        <h2 class="serif-heading" style="font-size: 18px;">Configured Weekly Hours</h2>
                    </div>

                    <div class="table-container">
                        <table class="medislot-table">
                            <thead>
                                <tr>
                                    <th>Day</th>
                                    <th>Hours</th>
                                    <th>Slot Length</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="s : ${schedules}">
                                    <td><strong th:text="${s.dayOfWeek}">MONDAY</strong></td>
                                    <td th:text="${#temporals.format(s.startTime, 'HH:mm') + ' - ' + #temporals.format(s.endTime, 'HH:mm')}">09:00 - 13:00</td>
                                    <td th:text="${s.slotDurationMinutes + ' mins'}">30 mins</td>
                                    <td><span class="status-pill status-confirmed">Active</span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Open Slots for Today / Upcoming -->
                <div class="surface-card">
                    <div class="card-header-clean">
                        <h2 class="serif-heading" style="font-size: 18px;">Open Consultation Slots Today</h2>
                        <span class="status-pill status-available" th:text="${upcomingSlots.size() + ' Available'}">0</span>
                    </div>

                    <div class="slot-grid" th:if="${not #lists.isEmpty(upcomingSlots)}">
                        <div class="slot-btn" th:each="s : ${upcomingSlots}" th:text="${#temporals.format(s.startTime, 'HH:mm')}">
                            09:00
                        </div>
                    </div>

                    <div class="empty-state" th:if="${#lists.isEmpty(upcomingSlots)}">
                        <p>No remaining open slots for today.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
