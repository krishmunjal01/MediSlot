<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('My Profile')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('profile')}"></aside>

    <div class="main-wrapper">
        <header th:replace="~{fragments/topbar :: topbar('Patient Demographic Profile', 'Patient / Profile')}"></header>

        <main class="content-container" style="max-width: 760px;">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="surface-card">
                <div class="card-header-clean">
                    <div>
                        <h2 class="serif-heading" style="font-size: 18px;">Update Personal Details</h2>
                        <p style="font-size: 12.5px;">Keep your hospital demographic and emergency contacts up to date.</p>
                    </div>
                    <span class="status-pill status-available" th:text="${'Patient Code: ' + patient.patientCode}">PAT-1001</span>
                </div>

                <form th:action="@{/patient/profile}" th:object="${profileForm}" method="post">
                    <input type="hidden" th:field="*{patientId}">

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div class="form-group" style="grid-column: span 2;">
                            <label class="form-label">Full Name *</label>
                            <input type="text" th:field="*{fullName}" class="form-control" required>
                            <div class="form-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Email Address *</label>
                            <input type="email" th:field="*{email}" class="form-control" required>
                            <div class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Phone Number *</label>
                            <input type="text" th:field="*{phone}" class="form-control" required>
                            <div class="form-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Date of Birth *</label>
                            <input type="date" th:field="*{dateOfBirth}" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Gender *</label>
                            <select th:field="*{gender}" class="form-select" required>
                                <option value="Female">Female</option>
                                <option value="Male">Male</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Blood Group</label>
                            <select th:field="*{bloodGroup}" class="form-select">
                                <option value="">Not known</option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Emergency Contact Phone</label>
                            <input type="text" th:field="*{emergencyContact}" class="form-control">
                        </div>

                        <div class="form-group" style="grid-column: span 2;">
                            <label class="form-label">Residential Address *</label>
                            <textarea th:field="*{address}" class="form-control" rows="2" required></textarea>
                            <div class="form-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                        </div>
                    </div>

                    <div style="margin-top: 24px;">
                        <button type="submit" class="btn-primary">Update Profile Information</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
</body>
</html>
